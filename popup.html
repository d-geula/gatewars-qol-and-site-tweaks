<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      width: 280px;
      background: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 16px 0;
      color: #fff;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    label {
      display: block;
      margin-bottom: 14px;
    }
    .label-text {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 13px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #ff6600;
    }
    textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 13px;
      font-family: system-ui, -apple-system, sans-serif;
      resize: vertical;
      min-height: 60px;
    }
    textarea:focus {
      outline: none;
      border-color: #ff6600;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #ff6600;
    }
    button {
      background: #ff6600;
      color: white;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
    }
    button:hover {
      background: #ff7722;
    }
    .saved {
      color: #4caf50;
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      display: none;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>🔍 Page Scanner</h1>

  <label>
    <span class="label-text">Start Page</span>
    <input type="number" id="startPage" min="1" max="2000" placeholder="1">
  </label>

  <label>
    <span class="label-text">End Page</span>
    <input type="number" id="endPage" min="1" max="2000" placeholder="2000">
  </label>

  <button id="startScanner" style="background: #4caf50;">Start Scanner</button>
  <button id="stopScanner" style="background: #f44336; display: none; margin-top: 8px;">Stop Scanner</button>
  <div class="saved" id="scannerMsg"></div>

  <h1 style="margin-top: 24px; border-top: 1px solid #333; padding-top: 16px;">⚔️ Battlefield Filter</h1>

  <label class="checkbox-label">
    <input type="checkbox" id="enableTreasuryFilter">
    <span>Enable Treasury Filter</span>
  </label>

  <label>
    <span class="label-text">Minimum Treasury (actual value)</span>
    <input type="number" id="threshold" min="0" step="100000" placeholder="500000">
    <div class="hint">Values are auto-reversed (e.g., 123,456 → 654,321)</div>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="enableArmySizeFilter">
    <span>Enable Army Size Filter</span>
  </label>

  <label>
    <span class="label-text">Minimum Army Size (actual value)</span>
    <input type="number" id="armySizeThreshold" min="0" step="100000" placeholder="0">
    <div class="hint">Values are auto-reversed (e.g., 123,456 → 654,321)</div>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="hideInactive">
    <span>Hide inactive players (no action buttons)</span>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="enableAllianceFilter">
    <span>Enable Alliance Filter</span>
  </label>

  <label>
    <span class="label-text">Alliance Blacklist</span>
    <textarea id="allianceBlacklist" placeholder="Enter alliance names, one per line."></textarea>
    <div class="hint">Matches the alliance name only (text before any &quot; - Title&quot;). Case-insensitive. Exact matches only. One per line.</div>
  </label>

  <button id="save">Apply Filter</button>
  <div class="saved" id="savedMsg">✓ Filter applied!</div>

  <script src="popup.js"></script>
</body>
</html>
