<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      width: 320px;
      box-sizing: border-box;
      background: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 16px 0;
      color: #fff;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    label {
      display: block;
      margin-bottom: 14px;
    }
    .label-text {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 13px;
    }
    input[type="number"],
    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
    }
    input[type="number"]:focus,
    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #ff6600;
    }
    textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 13px;
      font-family: system-ui, -apple-system, sans-serif;
      resize: vertical;
      min-height: 60px;
    }
    textarea:focus {
      outline: none;
      border-color: #ff6600;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #ff6600;
    }
    button {
      background: #ff6600;
      color: white;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
    }
    button:hover {
      background: #ff7722;
    }
    .saved {
      color: #4caf50;
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      display: none;
    }
    .meta {
      color: #888;
      text-align: center;
      margin-top: 6px;
      font-size: 11px;
      min-height: 14px;
    }
    .section-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #aaa;
      margin: 16px 0 10px;
      padding-top: 10px;
      border-top: 1px solid #333;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
    details {
      margin: -4px 0 14px;
      border: 1px solid #333;
      border-radius: 6px;
      background: #151515;
    }
    summary {
      cursor: pointer;
      font-size: 12px;
      padding: 10px;
      color: #ddd;
      user-select: none;
    }
    .details-content {
      border-top: 1px solid #333;
      padding: 10px;
    }
    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .button-row button {
      flex: 1;
      margin-top: 0;
      padding: 8px 10px;
      font-size: 12px;
    }
    #importSettingsInput {
      display: none;
    }
  </style>
</head>
<body>
  <h1>⚙️ Extension Settings</h1>

  <label class="checkbox-label">
    <input type="checkbox" id="hideInactive">
    <span>Hide inactive players (no action buttons)</span>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="scannerSoundEnabled">
    <span>Scanner match sound</span>
  </label>

  <label>
    <span class="label-text">Scanner sound volume (0-100)</span>
    <input type="number" id="scannerSoundVolume" min="0" max="100" step="5" placeholder="60">
    <div class="hint">Used for match notifications while scanning.</div>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="enableRefererOverride">
    <span>Override Referer header</span>
  </label>

  <label>
    <span class="label-text">Referer URL</span>
    <input type="text" id="refererOverrideUrl" placeholder="https://main.gatewa.rs/base.php?game=gatewars">
    <div class="hint">Used for direct battlefield page loads.</div>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="autoFillLoginEnabled">
    <span>Auto-fill Login Details</span>
  </label>

  <details>
    <summary>Login details (root page only)</summary>
    <div class="details-content">
      <label>
        <span class="label-text">Username</span>
        <input type="text" id="autoFillLoginUsername" autocomplete="off" placeholder="Username">
      </label>
      <label>
        <span class="label-text">Email</span>
        <input type="text" id="autoFillLoginEmail" autocomplete="off" placeholder="Email">
      </label>
      <label>
        <span class="label-text">Password</span>
        <input type="password" id="autoFillLoginPassword" autocomplete="off" placeholder="Password">
      </label>
      <div class="hint">Used only on https://main.gatewa.rs and https://main.gatewa.rs/.</div>
    </div>
  </details>

  <label>
    <span class="label-text">Alliance Blacklist</span>
    <textarea id="allianceBlacklist" placeholder="Enter alliance names, one per line."></textarea>
    <div class="hint">Matches the alliance name only (text before any &quot; - Title&quot;). Case-insensitive. Exact matches only. One per line.</div>
  </label>

  <div class="section-title">Site Tweaks</div>

  <label class="checkbox-label">
    <input type="checkbox" id="tweakSidebarListGroup">
    <span>Site links jumping fix</span>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="tweakClockTransparency">
    <span>Clock transparency fix</span>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="tweakGnrCountdown">
    <span>Ascension countdown</span>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="tweakMainTopOffset">
    <span>Main content top offset</span>
  </label>

  <div class="section-title">Settings Backup</div>
  <div class="button-row">
    <button id="exportSettings" type="button">Export JSON</button>
    <button id="importSettings" type="button">Import JSON</button>
  </div>
  <input id="importSettingsInput" type="file" accept="application/json,.json">

  <button id="saveSettings">Apply Settings</button>
  <div class="saved" id="savedSettingsMsg">✓ Settings applied!</div>
  <div class="meta" id="lastSavedAt">Last saved: never</div>

  <script src="popup.js"></script>
</body>
</html>
