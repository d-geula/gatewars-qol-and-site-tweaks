<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      width: 320px;
      box-sizing: border-box;
      background: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 16px 0;
      color: #fff;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
    }
    label {
      display: block;
      margin-bottom: 14px;
    }
    .label-text {
      display: block;
      font-weight: 500;
      margin-bottom: 6px;
      font-size: 13px;
    }
    input[type="number"] {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 14px;
    }
    input[type="number"]:focus {
      outline: none;
      border-color: #ff6600;
    }
    textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      background: #2a2a2a;
      border: 1px solid #444;
      color: #fff;
      border-radius: 4px;
      font-size: 13px;
      font-family: system-ui, -apple-system, sans-serif;
      resize: vertical;
      min-height: 60px;
    }
    textarea:focus {
      outline: none;
      border-color: #ff6600;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #ff6600;
    }
    button {
      background: #ff6600;
      color: white;
      border: none;
      padding: 10px 16px;
      cursor: pointer;
      border-radius: 4px;
      width: 100%;
      font-size: 14px;
      font-weight: 500;
      margin-top: 4px;
    }
    button:hover {
      background: #ff7722;
    }
    .saved {
      color: #4caf50;
      text-align: center;
      margin-top: 10px;
      font-size: 12px;
      display: none;
    }
    .hint {
      font-size: 11px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>
  <h1>⚙️ Battlefield Settings</h1>

  <label class="checkbox-label">
    <input type="checkbox" id="hideInactive">
    <span>Hide inactive players (no action buttons)</span>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="scannerSoundEnabled">
    <span>Scanner match sound</span>
  </label>

  <label>
    <span class="label-text">Scanner sound volume (0-100)</span>
    <input type="number" id="scannerSoundVolume" min="0" max="100" step="5" placeholder="60">
    <div class="hint">Used for match notifications while scanning.</div>
  </label>

  <label class="checkbox-label">
    <input type="checkbox" id="enableRefererOverride">
    <span>Override Referer header</span>
  </label>

  <label>
    <span class="label-text">Referer URL</span>
    <input type="text" id="refererOverrideUrl" placeholder="https://main.gatewa.rs/base.php?game=gatewars">
    <div class="hint">Used for direct battlefield page loads.</div>
  </label>

  <label>
    <span class="label-text">Alliance Blacklist</span>
    <textarea id="allianceBlacklist" placeholder="Enter alliance names, one per line."></textarea>
    <div class="hint">Matches the alliance name only (text before any &quot; - Title&quot;). Case-insensitive. Exact matches only. One per line.</div>
  </label>

  <button id="saveSettings">Apply Settings</button>
  <div class="saved" id="savedSettingsMsg">✓ Settings applied!</div>

  <script src="popup.js"></script>
</body>
</html>
